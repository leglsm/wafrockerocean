<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Capacity Projection Dashboard - Final Version</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #f1f5f9; --accent: #3b82f6; --ok: #3ecf8e; --gold: #fbbf24; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 1600px; margin: 0 auto; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 20px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        h2 { font-size: 0.9rem; color: var(--accent); margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        textarea { width: 100%; height: 220px; background: #0f172a; color: #94a3b8; border: 1px solid var(--border); padding: 10px; border-radius: 4px; resize: vertical; font-size: 11px; font-family: monospace; }
        
        .controls { display: flex; gap: 15px; align-items: center; margin-bottom: 15px; flex-wrap: wrap; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; }
        select, input { background: #0f172a; color: white; border: 1px solid var(--border); padding: 8px; border-radius: 4px; outline: none; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.8; }
        
        .preview-header { display: flex; gap: 20px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .summary-box { display: flex; gap: 10px; font-size: 0.9rem; font-weight: bold; }
        .stat-item { padding: 5px 12px; border-radius: 4px; background: #0f172a; border: 1px solid var(--border); display: flex; align-items: center; }
        .stat-label { color: #94a3b8; margin-right: 8px; font-size: 0.7rem; text-transform: uppercase; }

        .table-container { overflow-x: auto; max-height: 500px; border: 1px solid var(--border); background: #0f172a; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th { background: #334155; position: sticky; top: 0; padding: 10px; white-space: nowrap; z-index: 10; }
        td { border: 1px solid var(--border); padding: 6px; text-align: center; }
        .total-row { background: rgba(62, 207, 142, 0.15); font-weight: bold; color: var(--ok); }
        .status-msg { font-size: 0.85rem; color: var(--ok); margin-left: auto; }
    </style>
</head>

<div class="panel" id="previewSection" style="display:none;">

        <button onclick="updatePreview()">Show Data</button>

            <div class="stat-item" style="border-color: var(--gold);">
                <span class="stat-label">Total Current:</span>
                <span id="sumCurrent" style="color: var(--gold);">0.0</span>
            </div>
            <div class="stat-item" style="border-color: var(--ok);">
                <span class="stat-label">Total Proposal:</span>
                <span id="sumProposal" style="color: var(--ok);">0.0</span>

        <table id="targetTable">
            <thead id="targetHead"></thead>
            <tbody id="targetBody"></tbody>

<script>
let projectionStore = {}; 

function parseTSV(text) { return text.trim().split('\n').map(row => row.split('\t')); }

// 0.5/1.0 올림 계산 및 NaN 방어 로직
function calcProp(needed, step) { 
    if (isNaN(needed) || !isFinite(needed)) return 0;
    const s = parseFloat(step);
    return Math.ceil(needed * (1/s) - 1e-9) / (1/s); 
}

function processData() {
    const rRaw = parseTSV(document.getElementById('rockerPaste').value);
    const wRaw = parseTSV(document.getElementById('wafPaste').value);
    const fRaw = parseTSV(document.getElementById('forecastPaste').value);
    const slots = parseFloat(document.getElementById('slots').value) || 1;
    const rStep = document.getElementById('roundRocker').value;
    const wStep = document.getElementById('roundWaf').value;

    const cwList = fRaw[0].slice(1);
    const baseCW = cwList[0];
    const fMap = {};
    fRaw.slice(1).forEach(r => {
        fMap[r[0]] = {};
        cwList.forEach((cw, i) => fMap[r[0]][cw] = parseFloat(r[i+1]) || 0);
    });

    projectionStore = {}; 
    const cwPicker = document.getElementById('viewCW');
    cwPicker.innerHTML = '';
    cwList.forEach(cw => cwPicker.innerHTML += `<option value="${cw}">${cw}</option>`);

    const lines = [
        { name: 'WAF', data: wRaw, mult: 4, step: wStep },
        { name: 'Rocker', data: rRaw, mult: 2, step: rStep }
    ];

    lines.forEach(line => {
        cwList.forEach(cw => {
            const resultRows = [];
            let sumProp = 0;
            let sumCurr = 0;

            line.data.forEach((r, i) => {
                if (i === 0) return;
                const prog = r[0];
                const ratio = (fMap[prog] && fMap[prog][baseCW]) ? (fMap[prog][cw] / fMap[prog][baseCW]) : 1;
                
                const dMax = (parseFloat(r[2]) || 0) * ratio;
                const daily = dMax / 6;
                const needed = dMax / slots;
                const prop = calcProp(needed, line.step);
                const curr = parseFloat(r[6]) || 0;
                
                sumProp += prop;
                sumCurr += curr;

                resultRows.push({
                    "Program": prog, "Row Label": r[1] || "", "Daily Max": dMax.toFixed(2),
                    "Daily": daily.toFixed(2), "2DOH": (daily * 2).toFixed(2),
                    "Needed": needed.toFixed(3), "Current": curr.toFixed(1), "Proposal": prop.toFixed(1), "Comment": r[8] || ""
                });
            });

            projectionStore[`${line.name}_${cw}`] = {
                rows: resultRows,
                totalCurrent: (sumCurr * line.mult).toFixed(1),
                totalProposal: (sumProp * line.mult).toFixed(1),
                mult: line.mult
            };
        });
    });

    document.getElementById('previewSection').style.display = 'block';
    document.getElementById('status').innerText = "✅ Projection Completed!";
    updatePreview();
}

function updatePreview() {
    const line = document.getElementById('viewLine').value;
    const cw = document.getElementById('viewCW').value;
    const key = `${line}_${cw}`;
    const entry = projectionStore[key];
    
    if(!entry) return;

    // 상단 요약 수치 디스플레이 업데이트 (NaN 방어)
    document.getElementById('sumCurrent').innerText = parseFloat(entry.totalCurrent || 0).toLocaleString();
    document.getElementById('sumProposal').innerText = parseFloat(entry.totalProposal || 0).toLocaleString();

    const head = document.getElementById('targetHead');
    const body = document.getElementById('targetBody');
    
    const data = entry.rows;
    head.innerHTML = `<tr>${Object.keys(data[0]).map(k => `<th>${k}</th>`).join('')}</tr>`;
    body.innerHTML = '';
    
    data.forEach(row => {
        body.innerHTML += `<tr>${Object.values(row).map(v => `<td>${v}</td>`).join('')}</tr>`;
    });

    // 하단 TOTAL 행 추가
    body.innerHTML += `<tr class="total-row">
        <td colspan="7">TOTAL Capacity (${entry.mult}x Multiplier)</td>
        <td>${entry.totalProposal}</td>
        <td></td>
    </tr>`;
}

function downloadExcel() {
    if (Object.keys(projectionStore).length === 0) return alert("Run Projection first!");
    const wb = XLSX.utils.book_new();
    Object.keys(projectionStore).forEach(key => {
        const entry = projectionStore[key];
        const exportData = [...entry.rows];
        exportData.push({ "Program": "TOTAL", "Proposal": entry.totalProposal, "Comment": `${entry.mult}x Units` });
        
        const ws = XLSX.utils.json_to_sheet(exportData);
        XLSX.utils.book_append_sheet(wb, ws, key);
    });
    XLSX.writeFile(wb, "CW_Projection_Analysis.xlsx");
}
</script>
